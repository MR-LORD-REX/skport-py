[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skport-py"
description = "Async SKPORT API with public profile inspection and reusable account credentials."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
dynamic = ["version"]
authors = [{name = "sora", email = "sahikast6@gmail.com"}]
dependencies = ["aiohttp>=3.9,<4", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14", "build>=1.2"]

[tool.setuptools.dynamic]
version = {attr = "skport._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skport = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["local/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: explicit network checks requiring locally supplied credentials"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/skport"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
